<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5.4 CSS3 Images Assignment</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>CSS3 Image Effects</h1>
    <p class="intro">Six image projects recreated with HTML and CSS only.</p>

    <section class="project">
      <h2>1. Penguin Ellipse</h2>
      <img class="penguins" src="penguins.jpg" alt="Penguins">
    </section>

    <section class="project">
      <h2>2. Football Field + Tic-Tac-Toe</h2>
      <div class="football-frame" aria-label="Football field surrounded by tic-tac-toe tiles">
        <div class="ttt top">
          <span class="x"></span><span class="o"></span><span class="x"></span><span class="o"></span><span class="o"></span>
          <span class="x"></span><span class="o"></span><span class="x"></span><span class="o"></span><span class="x"></span>
        </div>
        <div class="ttt left">
          <span class="o"></span><span class="x"></span><span class="o"></span><span class="x"></span>
        </div>
        <img src="football_field.jpg" alt="Football field">
        <div class="ttt right">
          <span class="x"></span><span class="o"></span><span class="x"></span><span class="o"></span>
        </div>
        <div class="ttt bottom">
          <span class="x"></span><span class="o"></span><span class="x"></span><span class="o"></span><span class="x"></span>
          <span class="o"></span><span class="x"></span><span class="o"></span><span class="x"></span><span class="o"></span>
        </div>
      </div>
    </section>

    <section class="project">
      <h2>3. Dinosaur Shadow</h2>
      <img class="dinosaur" src="dinosaur.png" alt="Cartoon dinosaur">
    </section>

    <section class="project">
      <h2>4. Seagull Drop Shadow</h2>
      <div class="seagull-card">
        <img src="seagull.png" alt="Seagull in flight">
      </div>
    </section>

    <section class="project">
      <h2>5. Butterfly Filter</h2>
      <img class="butterfly" src="butterfly.jpg" alt="Butterfly">
    </section>

    <section class="project">
      <h2>6. Theater Blur + Text</h2>
      <div class="theater">
        <img src="theater_stage.jpg" alt="Theater stage">
        <span>Presenting</span>
      </div>
    </section>
  </main>
</body>
</html>
